    <rect x="23" y="25" width="55" height="52" rx="5" fill="#0d8b7e"/>
    <g stroke="#1c4149" stroke-width="6" stroke-linecap="round"><path d="M96 30h94M96 49h74M96 68h84"/></g>
    <g stroke="#aec6c5" stroke-width="5" stroke-linecap="round"><path d="M25 102h165M25 120h165M25 138h114"/></g>
