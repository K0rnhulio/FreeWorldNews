name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: freeworldnews
          - os: windows-latest
            binary: freeworldnews.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o dist/${{ matrix.binary }} .
      - uses: actions/upload-artifact@v7
        with:
          name: freeworldnews-${{ runner.os }}
          path: dist/${{ matrix.binary }}

  browser:
    name: Browser worker / Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: browser
      - run: npm test
        working-directory: browser

  container:
    name: Container / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t freeworldnews:ci .
      - run: docker run --rm freeworldnews:ci -help
